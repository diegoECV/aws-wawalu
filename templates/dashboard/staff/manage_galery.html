{% extends 'auth_base.html' %}
{% block content %}
<h2 class="text-xl font-bold mb-4">Gestión de Galería (Staff)</h2>
<a href="{{ url_for('add_galery_staff') }}" class="btn mb-4">Agregar Foto</a>
<table class="table-auto w-full">
  <thead>
    <tr>
      <th>Título</th>
      <th>Categoría</th>
      <th>Imagen</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    {% for item in galery_items %}
    <tr>
      <td>{{ item.title }}</td>
      <td>{{ item.category }}</td>
      <td><img src="/static/uploads/{{ item.image_url }}" alt="{{ item.title }}" width="80"></td>
      <td>
        <a href="{{ url_for('edit_galery_staff', item_id=item.id) }}" class="btn">Editar</a>
        <a href="{{ url_for('delete_galery_staff', item_id=item.id) }}" class="btn">Eliminar</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
